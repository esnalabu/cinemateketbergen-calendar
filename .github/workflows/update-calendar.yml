name: Oppdater filmprogram

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-cinemateket-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Hent repo
        uses: actions/checkout@v7

      - name: Set opp uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Installer Python og avhengigheiter
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Køyr testar
        run: uv run pytest -q

      - name: Hent førre publiserte kalender
        env:
          PAGES_URL: https://esnalabu.github.io/cinemateketbergen-calendar/cinemateketbergen.ics
        run: |
          mkdir -p _site
          if curl -fsSL --max-time 30 "$PAGES_URL" -o _site/cinemateketbergen.ics; then
            echo "Henta førre publiserte kalender."
          else
            rm -f _site/cinemateketbergen.ics
            echo "Fann ikkje førre publiserte kalender; alle hendingar får nytt DTSTAMP." >&2
          fi

      - name: Oppdater kalenderfil
        run: |
          uv run python scripts/update_calendar.py \
            --min-events 10 \
            --output _site/cinemateketbergen.ics

      - name: Last opp Pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    needs: update
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
