name: Oppdater filmprogram

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: update-cinemateket-calendar-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Hent repo
        uses: actions/checkout@v7

      - name: Set opp uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Installer Python og avhengigheiter
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Køyr testar
        run: uv run pytest -q

  auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Hent Dependabot-metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Slå på auto-merge for uv patch/minor
        if: steps.metadata.outputs.package-ecosystem == 'uv' && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

  update:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Hent repo
        uses: actions/checkout@v7

      - name: Set opp uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Installer Python og avhengigheiter
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Hent førre publiserte kalender
        env:
          PAGES_URL: https://esnalabu.github.io/cinemateketbergen-calendar/cinemateketbergen.ics
        run: |
          mkdir -p _site
          if curl -fsSL --max-time 30 "$PAGES_URL" -o _site/cinemateketbergen.ics; then
            echo "Henta førre publiserte kalender."
          else
            rm -f _site/cinemateketbergen.ics
            echo "Fann ikkje førre publiserte kalender; alle hendingar får nytt DTSTAMP." >&2
          fi

      - name: Oppdater kalenderfil
        run: |
          uv run python scripts/update_calendar.py \
            --min-events 10 \
            --output _site/cinemateketbergen.ics

      - name: Last opp Pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    needs: update
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
