name: Oppdater filmprogram

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cinemateket-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Hent repo
        uses: actions/checkout@v7

      - name: Set opp uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Installer Python og avhengigheiter
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Køyr testar
        run: uv run pytest -q

      - name: Oppdater kalenderfil
        run: uv run python scripts/update_calendar.py --min-events 10

      - name: Førebu Pages-artifact
        run: |
          mkdir -p _site
          cp cinemateketbergen.ics _site/

      - name: Last opp Pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Commit og push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cinemateketbergen.ics
          if git diff --cached --quiet -- cinemateketbergen.ics; then
            echo "Ingen endringar i kalenderfila."
            exit 0
          fi
          git commit -m "Oppdater filmprogram for Cinemateket Bergen"
          git push

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: update
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
