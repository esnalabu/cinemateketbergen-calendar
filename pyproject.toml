[project]
name = "cinemateketbergen-calendar"
version = "0.1.0"
description = "Genererer ei ICS-kalender for filmprogrammet til Cinemateket Bergen"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "icalendar>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
